<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>黄石 + 大提顿 · 7日深度游</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* ── Base ── */
        :root { --primary: #2e7d32; --bg: #e8f5e9; --text: #333; }
        *, *::before, *::after { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg); color: var(--text);
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }

        /* ── Layout ── */
        #main-wrapper {
            width: 90vw; height: 85vh; min-width: 800px;
            display: flex;
            background: #fff; border-radius: 16px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.2);
            overflow: hidden; position: relative;
        }
        #map-container { width: 50%; height: 100%; border-right: 2px solid #eee; position: relative; z-index: 1; }
        #map { width: 100%; height: 100%; }

        /* Itinerary panel */
        #itinerary-container {
            width: 50%; height: 100%;
            display: flex; flex-direction: column;
            background: #faf9f6;
            position: relative; z-index: 10;
        }

        /* ── Edit bar ── */
        #edit-bar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 9px 16px;
            background: #fff;
            border-bottom: 1px solid #e8e8e8;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            flex-shrink: 0;
        }
        #sync-status { display: flex; align-items: center; gap: 7px; font-size: 12px; color: #888; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #27ae60; flex-shrink: 0; }
        .status-dot.syncing { background: #f39c12; animation: pulse 1s ease-in-out infinite; }
        .status-dot.error   { background: #e74c3c; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

        #edit-controls { display: flex; gap: 8px; }
        .btn {
            padding: 7px 15px; border: none; border-radius: 8px;
            font-size: 13px; font-weight: 600; cursor: pointer;
            transition: background .18s, opacity .18s;
        }
        .btn:disabled { opacity: .55; cursor: not-allowed; }
        #btn-edit   { background: #ecf0f1; color: #2c3e50; }
        #btn-edit:hover:not(:disabled)   { background: #d5dbde; }
        #btn-save   { background: var(--primary); color: #fff; }
        #btn-save:hover:not(:disabled)   { background: #1b5e20; }
        #btn-cancel { background: #ecf0f1; color: #7f8c8d; }
        #btn-cancel:hover:not(:disabled) { background: #d5dbde; }

        /* ── Scroll area ── */
        #itinerary-scroll {
            flex: 1; overflow-y: scroll;
            padding: 20px 28px 36px;
            -webkit-overflow-scrolling: touch;
            position: relative;
        }
        #itinerary-scroll.editing { background: #fffef5; }

        /* ── Loading overlay ── */
        #loading-overlay {
            position: absolute; inset: 0;
            background: rgba(250,249,246,.92);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 12px; z-index: 50;
        }
        .spinner {
            width: 34px; height: 34px;
            border: 3px solid #ddd; border-top-color: var(--primary);
            border-radius: 50%; animation: spin .75s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { font-size: 13px; color: #999; }

        /* ── View mode typography ── */
        h1 { color: var(--primary); font-size: 22px; margin: 0 0 10px; border-bottom: 3px solid var(--primary); padding-bottom: 5px; display: inline-block; }
        .intro { font-size: 13px; color: #666; margin-bottom: 20px; line-height: 1.55; }
        .day-card {
            background: #fff;
            border-left: 4px solid var(--primary);
            border-radius: 0 8px 8px 0;
            padding: 15px; margin-bottom: 20px;
            box-shadow: 0 2px 10px rgba(0,0,0,.05);
        }
        .day-title { font-size: 16px; font-weight: bold; color: #2c3e50; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .drive-time { font-size: 11px; color: #fff; background: var(--primary); padding: 3px 8px; border-radius: 12px; white-space: nowrap; flex-shrink: 0; }
        .highlight-block { font-size: 13px; line-height: 1.6; color: #555; margin-bottom: 4px; }
        .highlight-block:last-child { margin-bottom: 0; }

        /* Highlights editor */
        .highlights-editor { display: flex; flex-direction: column; gap: 6px; }
        .highlight-item { display: flex; gap: 7px; align-items: flex-start; }
        .highlight-item textarea { flex: 1; resize: vertical; min-height: 52px; }
        .highlight-item .tag-delete-btn { margin-top: 2px; flex-shrink: 0; }
        .spot-tags { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 10px; }
        .spot-tag {
            display: inline-block; background: #ecf0f1; color: #34495e;
            padding: 8px 15px; border-radius: 6px;
            font-size: 12px; font-weight: 600; text-decoration: none;
            cursor: pointer; position: relative; z-index: 20; touch-action: manipulation;
        }
        .spot-tag:hover { background: var(--primary); color: #fff; }
        .hotel-info {
            display: flex; align-items: flex-start; gap: 12px;
            margin-top: 12px; padding: 12px;
            background: #f1f8e9; border-left: 3px solid var(--primary); border-radius: 4px;
        }
        .hotel-icon {
            width: 36px; height: 36px; background: var(--primary);
            border-radius: 50%; display: flex; align-items: center;
            justify-content: center; color: #fff; font-size: 18px; flex-shrink: 0;
        }
        .hotel-details { flex: 1; min-width: 0; }
        .hotel-name { font-size: 13px; font-weight: bold; color: #2c3e50; margin-bottom: 3px; }
        .hotel-name a { color: var(--primary); text-decoration: none; }
        .hotel-name a:hover { text-decoration: underline; }
        .hotel-address { font-size: 11px; color: #7f8c8d; line-height: 1.4; }

        /* ── Edit mode styles ── */
        .edit-banner {
            background: #fffbcc; border: 1px solid #e0c000;
            border-radius: 8px; padding: 9px 14px; margin-bottom: 16px;
            font-size: 12px; color: #7a6000;
        }
        .edit-section { margin-bottom: 14px; }
        .edit-label {
            display: block; font-size: 10px; font-weight: 700;
            color: #aaa; text-transform: uppercase; letter-spacing: .6px;
            margin-bottom: 4px;
        }
        .edit-field {
            width: 100%;
            border: 1.5px solid #dcc700;
            border-radius: 6px; padding: 7px 10px;
            font-family: inherit; font-size: 13px; color: #333;
            background: #fff; outline: none;
            transition: border-color .2s, box-shadow .2s;
        }
        .edit-field:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(46,125,50,.12);
        }
        .edit-textarea { resize: vertical; min-height: 62px; }
        .day-card.editing { border-left-color: #d4ac00; }

        .edit-row { margin-bottom: 10px; }
        .day-title-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .day-title-row .main-title { flex: 1; }
        .day-title-row .drive-col  { width: 135px; flex-shrink: 0; }

        /* Spot editor */
        .spots-editor { display: flex; flex-direction: column; gap: 7px; }
        .spot-editor-item {
            display: flex; flex-direction: column; gap: 5px;
            background: #f0f7ff; border: 1px dashed #7aaddf;
            border-radius: 6px; padding: 8px;
        }
        .spot-editor-top { display: flex; gap: 7px; align-items: center; }
        .spot-editor-top .edit-field { flex: 1; margin: 0; }
        .spot-editor-item > .edit-field { margin: 0; }
        .tag-delete-btn {
            background: #e74c3c; color: #fff; border: none;
            border-radius: 50%; width: 24px; height: 24px;
            cursor: pointer; font-size: 13px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            line-height: 1;
        }
        .tag-delete-btn:hover { background: #c0392b; }
        .add-tag-btn {
            display: inline-flex; align-items: center; gap: 4px;
            background: #27ae60; color: #fff; border: none;
            border-radius: 6px; padding: 7px 12px;
            font-size: 12px; font-weight: 600; cursor: pointer;
            align-self: flex-start; margin-top: 3px;
        }
        .add-tag-btn:hover { background: #219a52; }

        /* Hotel edit block */
        .hotel-edit-block {
            margin-top: 12px; padding: 12px;
            background: #f1f8e9; border-left: 3px solid var(--primary); border-radius: 4px;
        }
        .hotel-edit-header { font-size: 13px; font-weight: bold; color: #2c3e50; margin-bottom: 10px; }

        /* ── Toast ── */
        #toaster {
            position: fixed; bottom: 24px; left: 50%;
            transform: translateX(-50%) translateY(12px);
            background: #2c3e50; color: #fff;
            padding: 10px 20px; border-radius: 8px;
            font-size: 13px; opacity: 0;
            transition: opacity .25s, transform .25s;
            pointer-events: none; z-index: 9999;
        }
        #toaster.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        #toaster.success { background: #27ae60; }
        #toaster.error   { background: #e74c3c; }

        /* ── Car animation ── */
        .car-div-icon { background: none !important; border: none !important; }
        .car-emoji {
            font-size: 28px; display: block; line-height: 1;
            transition: transform 0.25s ease;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.35));
            transform-origin: center center;
        }
        .day-card { cursor: pointer; transition: box-shadow .2s; }
        .day-card:hover:not(.editing) { box-shadow: 0 4px 18px rgba(46,125,50,.18); }
        .day-card.active-day { box-shadow: 0 0 0 2.5px var(--primary), 0 4px 18px rgba(46,125,50,.22) !important; }

        /* ── Tips badge ── */
        .tip-badge {
            display: inline-block; font-size: 11px;
            background: #fff3e0; color: #e65100;
            border: 1px solid #ffb74d; border-radius: 4px;
            padding: 2px 7px; margin-left: 6px; vertical-align: middle;
        }

        /* ── Mode toggle bar ── */
        #mode-bar {
            display: flex; gap: 8px; padding: 8px 16px;
            background: #f8f9fa; border-bottom: 1px solid #e8e8e8;
            flex-shrink: 0;
        }
        .mode-btn {
            flex: 1; padding: 6px 10px;
            border: 1.5px solid #ddd; border-radius: 8px;
            background: #fff; color: #666;
            font-size: 12px; font-weight: 600; cursor: pointer;
            transition: all .18s; text-align: center;
        }
        .mode-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        .mode-btn:not(.active):hover { background: #e8f5e9; border-color: var(--primary); color: var(--primary); }
        #itinerary-content { transition: opacity .25s; }
    </style>
</head>

        <div id="map-container"><div id="map"></div></div>

        <div id="itinerary-container">
            <div id="edit-bar">
                <div id="sync-status">
                    <span class="status-dot syncing" id="status-dot"></span>
                    <span id="status-text">加载中...</span>
                </div>
                <div id="edit-controls">
                    <button class="btn" id="btn-edit">✏️ 编辑</button>
                    <button class="btn" id="btn-save"   hidden>💾 保存</button>
                    <button class="btn" id="btn-cancel" hidden>✕ 取消</button>

            <div id="mode-bar">

            </div>
        </div>
    </div>

    <div id="toaster"></div>

            const fromDist  = carRouteDist;
            const toDist    = snapToRoute(targetCoords);
            const distDelta = Math.abs(toDist - fromDist);
            const duration  = Math.min(3000, Math.max(800, distDelta * 400 + 600));

            const emojiEl = carMarker.getElement()?.querySelector('.car-emoji');
            if (emojiEl) emojiEl.style.transition = 'none';

            map.flyTo(targetCoords, 8, { duration: duration / 1000 });

            const startTime = performance.now();
            function frame(now) {
                const t    = Math.min((now - startTime) / duration, 1);
                const ease = t < 0.5 ? 2*t*t : -1 + (4 - 2*t)*t;
                const d    = fromDist + (toDist - fromDist) * ease;
                const pos  = getPointAtDist(d);

                carMarker.setLatLng(pos);
                carAngle = bearingAtDist(d) + 90;
                const el = carMarker.getElement()?.querySelector('.car-emoji');
                if (el) el.style.transform = `rotate(${carAngle}deg)`;

                if (t < 1) {
                    carAnimFrame = requestAnimationFrame(frame);
                } else {
                    carRouteDist = toDist;
                    carPos = [...pos];
                    if (el) {
                        el.style.transition = '';
                        el.style.transform = `rotate(${carAngle}deg) scale(1.4)`;
                        setTimeout(() => { if (el) el.style.transform = `rotate(${carAngle}deg) scale(1)`; }, 280);
                    }
                    const days = toArr(currentData?.days || []);
                    const day  = days[dayIndex];
                    if (day?.hotel?.name) {
                        carMarker.getPopup().setContent(`🏨 Day ${dayIndex}: ${day.hotel.name}`);
                        carMarker.openPopup();
                    }
                }
            }
            carAnimFrame = requestAnimationFrame(frame);
        }

        document.getElementById('itinerary-content').addEventListener('click', e => {
            if (isEditing) return;
            if (e.target.closest('a')) return;
            const card = e.target.closest('.day-card[data-day]');
            if (!card) return;
            const i = parseInt(card.dataset.day);
            const coords = getFallback(i);
            if (!coords) return;
            document.querySelectorAll('.day-card').forEach(c => c.classList.remove('active-day'));
            card.classList.add('active-day');
            animateCar(coords, i);
        });

        /* ─── Helpers ────────────────────────────────────────────────────── */
        const sleep = ms => new Promise(r => setTimeout(r, ms));

        function esc(str) {
            return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
        }

        function toArr(val) {
            if (!val) return [];
            if (Array.isArray(val)) return val;
            return Object.values(val);
        }

        function toHighlights(val) {
            if (!val) return [''];
            if (typeof val === 'string') return [val];
            return toArr(val).filter(s => s !== undefined);
        }

        function setStatus(state, text) {
            const dot = document.getElementById('status-dot');
            dot.className = 'status-dot' + (state === 'ok' ? '' : ' ' + state);
            document.getElementById('status-text').textContent = text;
        }

        function toast(msg, type = '') {
            const el = document.getElementById('toaster');
            el.textContent = msg;
            el.className = 'show ' + type;
            clearTimeout(el._timer);
            el._timer = setTimeout(() => { el.className = ''; }, 2800);
        }

        /* ─── Render: view mode ──────────────────────────────────────────── */
        function renderView(data) {
            document.getElementById('itinerary-scroll').classList.remove('editing');
            document.getElementById('btn-edit').hidden   = false;
            document.getElementById('btn-save').hidden   = true;
            document.getElementById('btn-cancel').hidden = true;

            const meta = data.meta || {};
            const days = toArr(data.days);

            let html = `<h1>${esc(meta.title)}</h1><p class="intro">${esc(meta.intro)}</p>`;

            days.forEach((day, i) => {
                const spots = toArr(day.spots);
                html += `<div class="day-card" data-day="${i}">`;
                html += `<div class="day-title">${esc(day.title)}<span class="drive-time">${esc(day.driveTime)}</span></div>`;
                toHighlights(day.highlights).forEach(h => {
                    if (h) html += `<div class="highlight-block">${esc(h)}</div>`;
                });

                if (spots.length) {
                    html += `<div class="spot-tags">`;
                    spots.forEach(s => {
                        html += `<a href="${esc(s.url)}" target="_blank" class="spot-tag">${esc(s.label)}</a>`;
                    });
                    html += `</div>`;
                }

                if (day.hotel) {
                    const isLastDay = day.hotel.name?.includes('✈️') || day.hotel.name?.includes('无需住宿');
                    html += `
                    <div class="hotel-info">
                        <div class="hotel-icon">${isLastDay ? '✈️' : '🏨'}</div>
                        <div class="hotel-details">
                            <div class="hotel-name">
                                ${day.hotel.url ? `<a href="${esc(day.hotel.url)}" target="_blank">${esc(day.hotel.name)}</a>` : esc(day.hotel.name)}
                            </div>
                            <div class="hotel-address">${esc(day.hotel.address)}</div>
                        </div>
                    </div>`;
                }
                html += `</div>`;
            });

            document.getElementById('itinerary-content').innerHTML = html;
        }

        /* ─── Render: edit mode ──────────────────────────────────────────── */
        function renderEdit(data) {
            document.getElementById('itinerary-scroll').classList.add('editing');
            document.getElementById('btn-edit').hidden   = true;
            document.getElementById('btn-save').hidden   = false;
            document.getElementById('btn-cancel').hidden = false;

            const meta = data.meta || {};
            const days = toArr(data.days);

            let html = `
            <div class="edit-banner">
                ✏️ <strong>编辑模式已开启</strong> — 修改完成后点击「保存」，数据存储在本地浏览器。
            </div>
            <div class="edit-section">
                <label class="edit-label">页面标题</label>
                <input class="edit-field" id="meta-title" value="${esc(meta.title)}">
            </div>
            <div class="edit-section">
                <label class="edit-label">页面简介</label>
                <textarea class="edit-field edit-textarea" id="meta-intro">${esc(meta.intro)}</textarea>
            </div>`;

            days.forEach((day, i) => {
                const spots = toArr(day.spots);
                html += `<div class="day-card editing" data-day="${i}">`;

                html += `
                <div class="day-title-row">
                    <div class="main-title">
                        <label class="edit-label">Day 标题</label>
                        <input class="edit-field day-title-input" value="${esc(day.title)}">
                    </div>
                    <div class="drive-col">
                        <label class="edit-label">驾车时间</label>
                        <input class="edit-field drive-time-input" value="${esc(day.driveTime)}">
                    </div>
                </div>`;

                html += `
                <div class="edit-row">
                    <label class="edit-label">行程描述</label>
                    <div class="highlights-editor" id="hl-${i}">`;
                toHighlights(day.highlights).forEach(h => {
                    html += highlightItem(h);
                });
                html += `
                        <button class="add-tag-btn" onclick="addHighlight('hl-${i}')">+ 添加描述</button>
                    </div>
                </div>`;

                html += `
                <div class="edit-row">
                    <label class="edit-label">景点标签</label>
                    <div class="spots-editor" id="spots-${i}">`;
                spots.forEach(s => {
                    html += spotEditorItem(s.label, s.url, s.address || '');
                });
                html += `
                        <button class="add-tag-btn" onclick="addSpot('spots-${i}')">+ 添加景点</button>
                    </div>
                </div>`;

                html += `
                <div class="hotel-edit-block">
                    <div class="hotel-edit-header">🏨 住宿信息</div>
                    <div class="edit-row">
                        <label class="edit-label">酒店名称</label>
                        <input class="edit-field hotel-name-input" value="${esc(day.hotel?.name || '')}">
                    </div>
                    <div class="edit-row">
                        <label class="edit-label">酒店网址</label>
                        <input class="edit-field hotel-url-input" value="${esc(day.hotel?.url || '')}">
                    </div>
                    <div class="edit-row" style="margin-bottom:0">
                        <label class="edit-label">酒店地址</label>
                        <input class="edit-field hotel-address-input" value="${esc(day.hotel?.address || '')}">
                    </div>
                </div>`;

                html += `</div>`;
            });

            document.getElementById('itinerary-content').innerHTML = html;
        }

        function highlightItem(text) {
            return `
            <div class="highlight-item">
                <textarea class="edit-field edit-textarea highlight-text-input">${esc(text)}</textarea>
                <button class="tag-delete-btn" title="删除此段描述" onclick="this.closest('.highlight-item').remove()">✕</button>
            </div>`;
        }

        function spotEditorItem(label, url, address = '') {
            return `
            <div class="spot-editor-item">
                <div class="spot-editor-top">
                    <input class="edit-field spot-label-input" placeholder="景点名称" value="${esc(label)}">
                    <button class="tag-delete-btn" title="删除景点" onclick="this.closest('.spot-editor-item').remove()">✕</button>
                </div>
                <input class="edit-field spot-url-input" placeholder="链接 URL（点标签跳转）" value="${esc(url)}">
                <input class="edit-field spot-address-input" placeholder="地点地址（可选，填写后将在地图打标记）" value="${esc(address)}">
            </div>`;
        }

        /* ─── Global helpers for inline onclick ──────────────────────────── */
        window.addHighlight = function(containerId) {
            const container = document.getElementById(containerId);
            const addBtn    = container.querySelector('.add-tag-btn');
            const div       = document.createElement('div');
            div.innerHTML   = highlightItem('');
            const item      = div.firstElementChild;
            container.insertBefore(item, addBtn);
            item.querySelector('textarea').focus();
        };

        window.addSpot = function(containerId) {
            const container = document.getElementById(containerId);
            const addBtn    = container.querySelector('.add-tag-btn');
            const div       = document.createElement('div');
            div.innerHTML   = spotEditorItem('', '', '');
            const item      = div.firstElementChild;
            container.insertBefore(item, addBtn);
            item.querySelector('.spot-label-input').focus();
        };

        /* ─── Collect form data ──────────────────────────────────────────── */
        function collectData() {
            const days = [];
            document.querySelectorAll('.day-card.editing').forEach(card => {
                const spots = [];
                card.querySelectorAll('.spot-editor-item').forEach(item => {
                    const label   = item.querySelector('.spot-label-input').value.trim();
                    const url     = item.querySelector('.spot-url-input').value.trim();
                    const address = item.querySelector('.spot-address-input').value.trim();
                    if (label) spots.push({ label, url, address });
                });
                const highlights = [];
                card.querySelectorAll('.highlight-text-input').forEach(ta => {
                    const v = ta.value.trim();
                    if (v) highlights.push(v);
                });
                days.push({
                    title:     card.querySelector('.day-title-input').value.trim(),
                    driveTime: card.querySelector('.drive-time-input').value.trim(),
                    highlights,
                    spots,
                    hotel: {
                        name:    card.querySelector('.hotel-name-input').value.trim(),
                        url:     card.querySelector('.hotel-url-input').value.trim(),
                        address: card.querySelector('.hotel-address-input').value.trim()
                    }
                });
            });
            return {
                meta: {
                    title: document.getElementById('meta-title').value.trim(),
                    intro: document.getElementById('meta-intro').value.trim()
                },
                days
            };
        }

        /* ─── Button handlers ────────────────────────────────────────────── */
        document.getElementById('btn-edit').addEventListener('click', () => {
            isEditing = true;
            renderEdit(currentData);
        });

        document.getElementById('btn-cancel').addEventListener('click', () => {
            isEditing = false;
            renderView(currentData);
        });

        document.getElementById('btn-save').addEventListener('click', async () => {
            const btn = document.getElementById('btn-save');
            btn.disabled = true;
            btn.textContent = '⏳ 保存中...';
            setStatus('syncing', '同步中...');
            try {
                const newData = collectData();
                await set(activeRef, newData);
                currentData = newData;
                isEditing   = false;
                renderView(currentData);
                hotelMarkersAdded = false;
                addHotelMarkers(toArr(currentData.days))
                    .then(() => addSpotMarkers(toArr(currentData.days)));
                hotelMarkersAdded = true;
                toast('保存成功！所有人将看到最新内容。', 'success');
                setStatus('ok', '已同步');
            } catch(err) {
                console.error(err);
                toast('保存失败，请检查网络或数据库权限。', 'error');
                setStatus('error', '同步失败');
            } finally {
                btn.disabled    = false;
                btn.textContent = '💾 保存';
            }
        });

        /* ─── Mode switching + Firebase listener ─────────────────────────── */
        function activateMode(mode) {
            currentMode   = mode;
            activeRef     = mode === 'full' ? dataRefFull : dataRefShort;
            activeDefault = mode === 'full' ? DEFAULT_DATA : DEFAULT_DATA_3DAY;

            document.getElementById('btn-mode-full').classList.toggle('active', mode === 'full');
            document.getElementById('btn-mode-short').classList.toggle('active', mode === 'short');

            if (isEditing) {
                isEditing = false;
                document.getElementById('btn-edit').hidden   = false;
                document.getElementById('btn-save').hidden   = true;
                document.getElementById('btn-cancel').hidden = true;
                document.getElementById('itinerary-scroll').classList.remove('editing');
            }

            if (unsubscribe) { unsubscribe(); unsubscribe = null; }
            hotelMarkersAdded = false;
            currentData = null;

            const content = document.getElementById('itinerary-content');
            content.style.opacity = '0';
            setStatus('syncing', '连接中...');

            unsubscribe = onValue(activeRef, (snapshot) => {
                document.getElementById('loading-overlay').style.display = 'none';
                setTimeout(() => { content.style.opacity = '1'; }, 50);

                if (snapshot.exists()) {
                    if (!isEditing) {
                        currentData = snapshot.val();
                        renderView(currentData);
                        if (!hotelMarkersAdded) {
                            addHotelMarkers(toArr(currentData.days))
                                .then(() => addSpotMarkers(toArr(currentData.days)));
                            hotelMarkersAdded = true;
                        }
                    }
                    setStatus('ok', '已同步');
                } else {
                    set(activeRef, activeDefault).then(() => {
                        currentData = activeDefault;
                        renderView(currentData);
                        addHotelMarkers(toArr(currentData.days))
                            .then(() => addSpotMarkers(toArr(currentData.days)));
                        hotelMarkersAdded = true;
                        setStatus('ok', '已同步');
                        toast('已初始化默认数据。', 'success');
                    }).catch(err => {
                        console.error('Seed error:', err);
                        currentData = activeDefault;
                        renderView(currentData);
                        setStatus('error', '初始化失败');
                        toast('数据库写入失败，请检查 Firebase 规则。', 'error');
                    });
                }
            }, (error) => {
                console.error('Firebase error:', error);
                document.getElementById('loading-overlay').style.display = 'none';
                content.style.opacity = '1';
                setStatus('error', '连接失败');
                if (!currentData) {
                    currentData = activeDefault;
                    renderView(currentData);
                    toast('无法连接数据库，显示本地默认数据。', 'error');
                }
            });
        }

        document.getElementById('btn-mode-full').addEventListener('click', () => {
            if (currentMode !== 'full') activateMode('full');
        });
        document.getElementById('btn-mode-short').addEventListener('click', () => {
            if (currentMode !== 'short') activateMode('short');
        });

        activateMode('full');
    </script>
</body>
</html>
